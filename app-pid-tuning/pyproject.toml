[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "robot-pid-tuner"
version = "0.1.0"
description = "VCP-based PID velocity tuning tool for the STM32 self-balancing robot"
requires-python = ">=3.11"
dependencies = [
    "pyserial>=3.5",
    "scipy>=1.11",
    "numpy>=1.24",
    "mcp>=1.0",
    "rich>=13.0",
    "PySide6>=6.6",
    "pyqtgraph>=0.13",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
robot-tuner = "main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["pid_tuner*"]
