[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "robot-cbc-tuner"
version = "0.1.0"
description = "Cascade balance PID tuner for the STM32 self-balancing robot"
requires-python = ">=3.11"
dependencies = [
    "pyserial>=3.5",
    "numpy>=1.24",
    "PySide6>=6.6",
    "pyqtgraph>=0.13",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.setuptools.packages.find]
where = ["."]
include = ["cbc_tuner*"]
